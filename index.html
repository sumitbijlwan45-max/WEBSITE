  <!-- Simple SVG icons via inline (no external icon lib needed) -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:      #a78bfa;
      --glow:        rgba(167,139,250,0.6);
      --card-bg:     rgba(10, 10, 15, 0.72);

      --sub:         rgba(255,255,255,0.55);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, #0f1420 0%, #070a11 45%, #04060a 100%);
      font-family: 'Inter', 'DM Sans', sans-serif;
      color: var(--text);
      letter-spacing: 0.03em;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1600&q=70') center/cover no-repeat;
      opacity: 0.28;
      filter: blur(3px) contrast(0.7);
      z-index: -2;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(131, 58, 180, 0.35), rgba(0,0,0,0.8) 70%);
      z-index: -1;
    }

    /* ── ENTER OVERLAY ── */
    #enter-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: opacity 0.6s;
    }
    #enter-overlay.hidden { opacity: 0; pointer-events: none; }

    #enter-box {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      color: #fff;
    }
    #enter-box span {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }
    #enter-pulse {
      position: absolute;
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      animation: pulse-ring 1.6s ease-out infinite;
    }
    #enter-box svg {
      position: relative; z-index: 1;
      color: var(--accent);
      filter: drop-shadow(0 0 16px var(--accent));
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* ── VIDEO BACKGROUND ── */
    #yt-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    #yt-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.52);
    }
    #yt-bg iframe {
      position: absolute;
      top: 50%; left: 50%;
      width: 177.78vh;   /* 16/9 * 100vh */
      height: 100vh;
      min-width: 100vw;
      min-height: 56.25vw; /* 9/16 * 100vw */
      transform: translate(-50%, -50%);
      border: none;
      pointer-events: none;
    }

    /* ── SOUND TOGGLE ── */
    #sound-btn {
      position: fixed;
      top: 18px; left: 18px;
      z-index: 99;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      width: 42px; height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(8px);
    }
    #sound-btn:hover {
      background: rgba(255,255,255,0.18);
      box-shadow: 0 0 14px var(--glow);
    }
    #sound-btn svg { width: 18px; height: 18px; }

    /* ── CENTER STAGE ── */
    #stage {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── CARD ── */
    .card {
      background: linear-gradient(145deg, rgba(16,18,29,0.75), rgba(8,9,14,0.85));
      border: 1px solid rgba(120,106,255,0.35);
      border-radius: 30px;
      padding: 44px 40px 42px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      backdrop-filter: blur(20px) saturate(180%);
      box-shadow:
        inset 0 0 1px rgba(255,255,255,0.15),
        0 24px 40px rgba(0,0,0,0.45),
        0 0 90px rgba(131, 58, 180, 0.34);
      animation: cardIn 0.7s cubic-bezier(0.25,1,0.5,1) both;
    }

    .card:hover {
      transform: translateY(-2px) scale(1.005);
      box-shadow:
        inset 0 0 1px rgba(255,255,255,0.25),
        0 30px 52px rgba(0,0,0,0.55),
        0 0 110px rgba(131, 58, 180, 0.4);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to   { opacity: 1; transform: none; }
    }

    /* ── AVATAR ── */
    .avatar-wrap {
      position: relative;
      width: 96px; height: 96px;
      margin: 0 auto 18px;
    }
    .avatar-wrap::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--accent), #818cf8, #c084fc, var(--accent));
      animation: spin 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar {
      position: relative;
      width: 96px; height: 96px;
      border-radius: 50%;
      overflow: hidden;
      background: #1e1b30;
      border: 3px solid #0a0a0f;
      z-index: 1;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
    }
    .avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* ── NAME & TAGLINE ── */
    .name {
      font-family: 'Syne', sans-serif;
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
      background: linear-gradient(130deg, #ffffff, #a180ff 65%, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 15px rgba(150,120,255,0.5);
    }
    .tagline {
      color: rgba(225,225,255,0.88);
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 30px;
      mix-blend-mode: lighten;
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
      margin-bottom: 24px;
    }

    /* ── SOCIAL ICONS ROW ── */
    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .social-btn {
      width: 52px; height: 52px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.25s, border-color 0.25s, background 0.25s;
      position: relative;
      overflow: hidden;
    }
    .social-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, var(--glow) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .social-btn:hover::before { opacity: 1; }
    .social-btn:hover {
      transform: translateY(-4px) scale(1.08);
      border-color: #8c84ff;
      box-shadow: 0 0 18px rgba(120, 98, 255, 0.7), 0 9px 28px rgba(0,0,0,0.4);
      background: rgba(103,97,218,0.22);
    }
    .social-btn svg {
      transition: transform 0.24s ease, fill 0.24s ease;
    }
    .social-btn:hover svg {
      transform: scale(1.1);
      fill: #fff;
    }
    .social-btn:active {
      transform: translateY(-1px) scale(0.97);
      transition: transform 0.06s;
    }
    .social-btn svg { width: 24px; height: 24px; position: relative; z-index: 1; }

    /* tooltip */
    .social-btn[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,10,20,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      font-size: 0.72rem;
      white-space: nowrap;
      padding: 4px 10px;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s;
    }
    .social-btn:hover[data-tip]::after { opacity: 1; }

    /* ── EXTRA LINKS ── */
    .links { display: flex; flex-direction: column; gap: 10px; }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.25s, border-color 0.25s, background 0.25s;
      position: relative;
      overflow: hidden;
    }
    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 120%, var(--glow) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .link-btn:hover::before { opacity: 1; }
    .link-btn:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 0 18px var(--glow), 0 8px 20px rgba(0,0,0,0.35);
      background: rgba(167,139,250,0.1);
    }
    .link-btn:active {
      transform: scale(0.97);
      transition: transform 0.06s;
    }
    .link-btn .icon { font-size: 1.1rem; }
    .link-btn .lbl  { position: relative; z-index: 1; }
  </style>
</head>
<body>

  // ── Avatar ──
  const avatarEl = document.getElementById('avatar-el');
  if (CONFIG.avatarUrl) {
    avatarEl.innerHTML = `<img src="${CONFIG.avatarUrl}" alt="${CONFIG.name}" />`;
  } else {
    avatarEl.textContent = CONFIG.name.trim().split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

  // ── Name & tagline ──
  document.getElementById('name-el').textContent    = CONFIG.name;

  // Typewriter tagline
  const taglineText = CONFIG.tagline;
  const taglineEl = document.getElementById('tagline-el');
  let tagPos = 0;
  function typeTagline() {
    if (tagPos <= taglineText.length) {
      taglineEl.textContent = taglineText.slice(0, tagPos);
      tagPos += 1;
      setTimeout(typeTagline, 60);

        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>

    },
    discord: {

      </svg>`
    },
  };

  const socialsEl = document.getElementById('socials-el');
  Object.entries(CONFIG.socials).forEach(([key, val]) => {
    if (!val || !SOCIAL_DEFS[key]) return;
    const def = SOCIAL_DEFS[key];
    const a = document.createElement('a');
    a.className   = 'social-btn';
    a.href        = def.url(val);
    a.target      = '_blank';
    a.rel         = 'noopener noreferrer';
    a.dataset.tip = `@${val}`;
    a.innerHTML   = def.svg;

    // Haptic feedback
    a.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
    });

    socialsEl.appendChild(a);
  });

  // ── Extra links ──
  const linksEl = document.getElementById('links-el');
  CONFIG.links.forEach(item => {
    const a = document.createElement('a');
    a.className = 'link-btn';
    a.href      = item.url;
    a.target    = '_blank';
    a.rel       = 'noopener noreferrer';
    a.innerHTML = `<span class="icon">${item.icon || '🔗'}</span><span class="lbl">${item.label}</span>`;
    a.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
    });
    linksEl.appendChild(a);
  });

  // ── YouTube Player ──
  let player;
  let playerReady = false;
  let isMuted = !CONFIG.videoSound;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      videoId: CONFIG.youtubeVideoId,
      playerVars: {
        autoplay:       0,
        loop:           1,
        playlist:       CONFIG.youtubeVideoId,
        controls:       0,
        showinfo:       0,
        modestbranding: 1,
        iv_load_policy: 3,
        rel:            0,
        start:          CONFIG.videoStartSeconds,
        mute:           0,
        enablejsapi:    1,
        playsinline:    1,
      },
      events: {
        onReady: () => { playerReady = true; },
        onStateChange: e => {
          if (e.data === YT.PlayerState.ENDED) player.playVideo();
        }
      }
    });
  }

  // ── Enter overlay ──
  const overlay = document.getElementById('enter-overlay');
  overlay.addEventListener('click', () => {
    overlay.classList.add('hidden');
    if (navigator.vibrate) navigator.vibrate([10, 40, 10]);

    // Try to play video immediately, then set up volume/mute
    if (player && player.playVideo) {
      player.playVideo();
      player.setVolume(CONFIG.videoVolume);
      if (isMuted) { player.mute(); } else { player.unMute(); }
      updateSoundIcon();
    } else {
      // Fallback: wait for player to be ready
      const tryPlay = setInterval(() => {
        if (!playerReady || !player) return;
        clearInterval(tryPlay);
        player.setVolume(CONFIG.videoVolume);
        if (isMuted) { player.mute(); } else { player.unMute(); }
        player.playVideo();
        updateSoundIcon();
      }, 100);
    }
  });

  function toggleSound() {
    if (!player) return;
    isMuted = !isMuted;
    if (isMuted) { player.mute(); } else { player.unMute(); player.setVolume(CONFIG.videoVolume); }
    updateSoundIcon();
    if (navigator.vibrate) navigator.vibrate(20);
  }

  function updateSoundIcon() {
    document.getElementById('icon-sound-on').style.display  = isMuted ? 'none' : '';
    document.getElementById('icon-sound-off').style.display = isMuted ? ''     : 'none';
  }
</script>
</body>
</html>
